version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
    ignore:
      # Electron majors carry breaking changes — bump manually.
      - dependency-name: electron
        update-types: [version-update:semver-major]
      # React Native majors bring RN Architecture / codegen churn — bump manually.
      - dependency-name: react-native
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
