name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          # Skip electron post-install download in CI — we only run type
          # checking and vitest here, no packaging.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run tests
        run: npm test

  security-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit production dependencies
        run: npm audit --production --audit-level=high
